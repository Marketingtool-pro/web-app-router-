# Production bundle build. This app is bundled with Vite (not webpack), so this
# workflow builds with the project's own `pnpm run build` and uploads dist/.
name: NodeJS with Webpack

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build
        run: pnpm run build
      # No dist upload (removed 2026-10-25): no workflow downloads it, and at
      # ~800 MB per push (public/images is 763 MB) it filled the org's free-plan
      # artifact storage, so every other workflow's artifact uploads failed.
      - name: Report build size
        run: du -sh dist
