name: OpenShift

env:
  OPENSHIFT_SERVER: \${{ secrets.OPENSHIFT_SERVER }}
  OPENSHIFT_TOKEN: \${{ secrets.OPENSHIFT_TOKEN }}
  OPENSHIFT_NAMESPACE: ""
  APP_NAME: ""
  APP_PORT: ""
  IMAGE_REGISTRY: ghcr.io/\${{ github.repository_owner }}
  IMAGE_REGISTRY_USER: \${{ github.actor }}
  IMAGE_REGISTRY_PASSWORD: \${{ github.token }}
  IMAGE_TAGS: ""

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  openshift-ci-cd:
    name: Build and deploy to OpenShift
    runs-on: ubuntu-24.04 # Updated to clear the ubuntu-latest warning
    environment: production

    outputs:
      ROUTE: \${{ steps.deploy-and-expose.outputs.route }}
      SELECTOR: \${{ steps.deploy-and-expose.outputs.selector }}

    steps:
    # 1. Validate secrets using a pinned version of github-script
    - name: Check for required secrets
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
      with:
        script: |
          const secrets = {
            OPENSHIFT_SERVER: `${{ secrets.OPENSHIFT_SERVER }}`,
            OPENSHIFT_TOKEN: `${{ secrets.OPENSHIFT_TOKEN }}`,
          };
          const GHCR = "ghcr.io";
          if (`${{ env.IMAGE_REGISTRY }}`.startsWith(GHCR)) {
            core.info(`Image registry is ${GHCR} - no registry password required`);
          }
          else {
            core.info("A registry password is required");
            secrets["IMAGE_REGISTRY_PASSWORD"] = `${{ secrets.IMAGE_REGISTRY_PASSWORD }}`;
          }
          const missingSecrets = Object.entries(secrets).filter(([ name, value ]) => {
            if (value.length === 0) {
              core.error(`Secret "${name}" is not set`);
              return true;
            }
            core.info(`✔️ Secret "${name}" is set`);
            return false;
          });
          if (missingSecrets.length > 0) {
            core.setFailed(`❌ At least one required secret is not set in the repository.`);
          }
          else {
            core.info(`✅ All the required secrets are set`);
          }

    # 2. Secure checkout
    - name: Check out repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

    - name: Determine app name
      if: env.APP_NAME == ''
      run: |
        echo "APP_NAME=\$(basename PWD)" | tee -a GITHUB_ENV

    - name: Determine image tags
      if: env.IMAGE_TAGS == ''
      run: |
        echo "IMAGE_TAGS=latest \({GITHUB_SHA::12}" \vert{} tee -a \)GITHUB_ENV

    # 3. Build container via Buildah
    - name: Build from Dockerfile
      id: build-image
      uses: redhat-actions/buildah-build@7a95dbd9d02db5ec4a08bbfa27fb6fb113ff78f8
      with:
        image: \${{ env.APP_NAME }}
        tags: \${{ env.IMAGE_TAGS }}
        dockerfiles: |
          ./Dockerfile

    # 4. Push built artifact to GHCR
    - name: Push to registry
      id: push-image
      uses: redhat-actions/push-to-registry@5ed88d29b28fe7ca2bfbc7b949214749f7ba3043
      with:
        image: \${{ steps.build-image.outputs.image }}
        tags: \${{ steps.build-image.outputs.tags }}
        registry: \${{ env.IMAGE_REGISTRY }}
        username: \${{ env.IMAGE_REGISTRY_USER }}
        password: \${{ env.IMAGE_REGISTRY_PASSWORD }}

    # 5. Fetch OpenShift CLI binaries securely
    - name: Install oc
      uses: redhat-actions/openshift-tools-installer@b2272af8f237efb8e23e2fb3d2f704fb38bc2c29
      with:
        oc: 4

    # 6. Establish secure cluster handshake
    - name: Log in to OpenShift
      uses: redhat-actions/oc-login@4f6867b14d24a919d8a60496dd1874b24b62b2370ed4c78
      with:
        openshift_server_url: \${{ env.OPENSHIFT_SERVER }}
        openshift_token: \${{ env.OPENSHIFT_TOKEN }}
        insecure_skip_tls_verify: true
        namespace: \${{ env.OPENSHIFT_NAMESPACE }}

    # 7. Generate application manifests and expose endpoints
    - name: Create and expose app
      id: deploy-and-expose
      uses: redhat-actions/oc-new-app@6d6cc99c83693fb42cb838a1662cdeca4d7df6fb
      with:
        app_name: \${{ env.APP_NAME }}
        image: \${{ steps.push-image.outputs.registry-path }}
        namespace: \${{ env.OPENSHIFT_NAMESPACE }}
        port: \${{ env.APP_PORT }}

    # 8. Report out public routing status
    - name: Print application URL
      env:
        ROUTE: \${{ steps.deploy-and-expose.outputs.route }}
        SELECTOR: \${{ steps.deploy-and-expose.outputs.selector }}
      run: |
        [[ -n "\${{ env.ROUTE }}" ]] || (echo "Determining application route failed in previous step"; exit 1)
        echo
        echo "======================== Your application is available at: ========================"
        echo "\${{ env.ROUTE }}"
        echo "==================================================================================="
        echo
        echo "Your app can be taken down with: \"oc delete all --selector='\${{ env.SELECTOR }}'\""
