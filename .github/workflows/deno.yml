name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository code (pinned to v4.2.2 / v4 release commit)
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # 2. Install Deno and configure caching (pinned to v2 release commit)
      - name: Setup Deno
        uses: denoland/setup-deno@b92e76ca4ff0156d9571f5ce0b2a65825de75b1f # v2.1.2
        with:
          deno-version: v2.x 
          cache: true        

      # 3. Cleanly install project dependencies using the lockfile
      - name: Install Dependencies
        run: deno ci

      # 4. Check if code aligns with Deno's default formatting
      - name: Verify Formatting
        run: deno fmt --check

      # 5. Run static analysis code linter
      - name: Run Linter
        run: deno lint

      # 6. Execute test suite
      - name: Run Tests
        run: deno test --allow-all
