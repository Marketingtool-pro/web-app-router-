name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install Deno and configure caching
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x # Pin to the latest stable Deno 2 major version
          cache: true        # Caches dependencies automatically between runs

      # 3. Cleanly install project dependencies using the lockfile
      - name: Install Dependencies
        run: deno ci

      # 4. Check if code aligns with Deno's default formatting
      - name: Verify Formatting
        run: deno fmt --check

      # 5. Run static analysis code linter
      - name: Run Linter
        run: deno lint

      # 6. Execute test suite
      - name: Run Tests
        run: deno test --allow-all
