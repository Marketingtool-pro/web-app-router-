# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
#
# Microsoft Security DevOps (MSDO) is a command line application which
# integrates static analysis tools into the development cycle. MSDO installs,
# configures and runs the latest versions of static analysis tools (including,
# but not limited to, SDL/security and compliance tools).
#
# For more information, check out https://github.com/microsoft/security-devops-action

name: "Microsoft Defender For Devops"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '19 16 * * 5'

# Default to read-only for anything not explicitly granted at job level.
permissions:
  contents: read

# Only the newest scan per branch / pull request needs to finish.
concurrency:
  group: msdo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  MSDO:
    # The action supports Windows and Linux runners (not macOS). Linux is used
    # because some image files in this repo exceed the Windows path length limit.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1  # v5.4.0
        with:
          dotnet-version: 8.0.x

      - name: Run Microsoft Security DevOps
        uses: microsoft/security-devops-action@08976cb623803b1b36d7112d4ff9f59eae704de0  # v1.12.0
        id: msdo

      - name: Upload results to Security tab
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
        with:
          sarif_file: ${{ steps.msdo.outputs.sarifFile }}
