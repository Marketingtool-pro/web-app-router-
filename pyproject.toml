[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
# name and version are required by PEP 621. Both were missing, so every tool
# that reads this file (pip, uv, pdm, ruff's project discovery) rejected it
# even after the unterminated authors array was fixed.
name = "web-app-router"
version = "1.0.0"
requires-python = ">=3.10"
authors = [
    {name = "Node.js contributors", email = "help@marketingtool.pro"},
]
# The Python module "packaging" is vendored in the "pylib/packaging" directory to support Python >= 3.12.
# dependencies = ["packaging>=23.1"]  # Uncomment this line if the vendored version is removed,

classifiers = [ 
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []
description = "Default template for PDM package"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["flake8", "ruff", "pytest"]

[project.scripts]
gyp = "gyp:script_main"

[project.urls]
"Homepage" = "https://github.com/Marketingtool-pro/web-app-router-"

[tool.ruff]
lint.select = [
  "C4", # flake8-comprehensions
  "C90", # McCabe cyclomatic complexity
  "DTZ", # flake8-datetimez
  "E", # pycodestyle
  "F", # Pyflakes
  "G", # flake8-logging-format
  "ICN", # flake8-import-conventions
  "INT", # flake8-gettext
  "PL", # Pylint
  "PYI", # flake8-pyi
  "RSE", # flake8-raise
  "RUF", # Ruff-specific rules
  "T10", # flake8-debugger
  "TCH", # flake8-type-checking
  "TID", # flake8-tidy-imports
  "UP", # pyupgrade
  "W", # pycodestyle
  "YTT", # flake8-2020
  # "A",    # flake8-builtins
  # "ANN",  # flake8-annotations
  # "ARG",  # flake8-unused-arguments
  # "B",    # flake8-bugbear
  # "BLE",  # flake8-blind-except
  # "COM",  # flake8-commas
  # "D",    # pydocstyle
  # "DJ",   # flake8-django
  # "EM",   # flake8-errmsg
  # "ERA",  # eradicate
  # "EXE",  # flake8-executable
  # "FBT",  # flake8-boolean-trap
  # "I",    # isort
  # "INP",  # flake8-no-pep420
  # "ISC",  # flake8-implicit-str-concat
  # "N",    # pep8-naming
  # "NPY",  # NumPy-specific rules
  # "PD",   # pandas-vet
  # "PGH",  # pygrep-hooks
  # "PIE",  # flake8-pie
  # "PT",   # flake8-pytest-style
  # "PTH",  # flake8-use-pathlib
  # "Q",    # flake8-quotes
  # "RET",  # flake8-return
  # "S",    # flake8-bandit
  # "SIM",  # flake8-simplify
  # "SLF",  # flake8-self
  # "T20",  # flake8-print
  # "TRY",  # tryceratops
]
lint.ignore = [
  "E721",
  "PLC1901",
  "PLR0402",
  "PLR1714",
  "PLR2004",
  "PLR5501",
  "PLW0603",
  "PLW2901",
  "PYI024",
  "RUF005",
  "RUF012",
  "UP031",
]
extend-exclude = ["pylib/packaging"]
line-length = 88
target-version = "py37"

[tool.ruff.lint.mccabe]
max-complexity = 101

[tool.ruff.lint.pylint]
max-args = 11
max-branches = 108
max-returns = 10
max-statements = 286

[tool.setuptools]
package-dir = { "" = "pylib" }
packages = ["gyp", "gyp.generator"]

[tool.pdm]
distribution = true
