config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",

  # Everything below is unrelated tooling that was dumped into this repo
  # (buck2, direnv, pcre2, fairseq, rubygems, a vite playground, gerrit,
  # ubuntu docs, ...). None of it is the web app. Without these, qlty lints
  # thousands of foreign files and its eslint/prettier plugins die on their
  # configs. Only src/ and the app's own files should be checked.
  ".agents/**",
  ".bundle/**",
  ".claude/**",
  ".ghjk/**",
  ".qlty/**",
  "<%= gem_home %>/**",
  "Core-Plugins/**",
  "DEST/**",
  "GEM_HOME/**",
  "account/**",
  "apex/**",
  "barbican/**",
  "bazlets/**",
  "bin/**",
  "buck/**",
  "buck2/**",
  "direnv/**",
  "fairseq/**",
  "gerrit/**",
  "installer/**",
  "marketingtool/**",
  "mcp-webresearch/**",
  "metatype-0.5.1-rc.6/**",
  "pcre2/**",
  "pip/**",
  "pylib/**",
  "rake-13.4.2/**",
  "rubydoc.info/**",
  "rubygems-4.0.19/**",
  "rubyinstaller2/**",
  "source/**",
  "src/**",
  "tests/**",
  "ubuntu-server-documentation/**",
  "vite/**",
  "my-tanstack-app/**",
  "site/**",
  ".yarn/**",
  ".firebase/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true


[[plugin]]
name = "actionlint"

[[plugin]]
name = "eslint"
package_file = "package.json"
package_filters = ["eslint", "prettier"]

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "prettier"
package_file = "package.json"
package_filters = ["prettier"]

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "zizmor"
