overrides:
  js-yaml: ^4.3.2
  browserslist: ^4.28.7
  baseline-browser-mapping: ^2.11.0
  # drizzle-kit -> @esbuild-kit/esm-loader -> @esbuild-kit/core-utils pins esbuild 0.18.x
  # which is vulnerable (GHSA-67mh-4wv8-2f99). Force that chain onto a patched esbuild.
  # Caret-bounded on purpose: an open '>=' range would let a future incompatible major
  # land silently. Only the @esbuild-kit chain matches '<0.25.0'; vite keeps its own 0.28.x.
  'esbuild@<0.25.0': '^0.25.12'
  'nanoid@<3.3.18': '^3.3.18'
allowBuilds:
  esbuild: true
  lightningcss: true
